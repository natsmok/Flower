<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love.css</title>
<style>
  :root{
    --red: #ff2d55;
    --red-dark: #b3082f;
    --green: #2f8f4e;
    --green-dark: #1c5e30;
    --bg: #060002;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .screen{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 40%, rgba(255,45,85,0.10), transparent 60%), var(--bg);
  }

  /* ---------- LOADING CARD ---------- */
  #loading-screen{ z-index:5; transition: opacity .6s ease; }
  .card{
    width: 300px;
    padding: 36px 28px 28px;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,45,85,0.25);
    box-shadow: 0 0 60px rgba(255,45,85,0.15), inset 0 0 40px rgba(255,45,85,0.05);
    text-align:center;
  }
  .bud-emoji{
    font-size: 46px; display:inline-block;
    filter: drop-shadow(0 0 18px rgba(255,45,85,0.6));
    animation: bud-pulse 2.2s ease-in-out infinite;
  }
  @keyframes bud-pulse{
    0%,100%{ transform: scale(1) rotate(-2deg); }
    50%{ transform: scale(1.08) rotate(2deg); }
  }
  .card h1{ margin-top: 16px; color:#fff; font-size: 22px; letter-spacing: 0.5px; font-weight: 700; }
  .bar-track{
    margin-top: 22px; height: 6px; width: 100%; border-radius: 999px;
    background: rgba(255,255,255,0.08); overflow:hidden;
  }
  .bar-fill{
    height:100%; width:0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--red-dark), var(--red));
    box-shadow: 0 0 12px rgba(255,45,85,0.7);
    transition: width .25s linear;
  }
  .status-text{ margin-top: 12px; font-size: 12px; letter-spacing: 1px; color: rgba(255,255,255,0.45); }
  .bloom-btn{
    margin-top: 22px; width:100%; padding: 14px 0; border-radius: 12px; border: none;
    background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.3);
    font-weight:700; letter-spacing: 1.5px; font-size: 13px; cursor: not-allowed; transition: all .4s ease;
  }
  .bloom-btn.ready{
    color:#fff; background: linear-gradient(90deg, var(--red-dark), var(--red));
    box-shadow: 0 6px 20px rgba(255,45,85,0.35); cursor:pointer;
  }
  .bloom-btn.ready:active{ transform: scale(0.97); }

  /* ---------- GARDEN / BLOOM SCREEN ---------- */
  #garden-screen{ z-index:3; opacity:0; pointer-events:none; transition: opacity .8s ease; }
  #garden-screen.show{ opacity:1; pointer-events:auto; }

  /* 🌹 EDIT HERE: overall size of the whole flower scene.
     Make this bigger/smaller to scale EVERYTHING (stem, leaves, petals) together. */
  .rose-wrap{
    position:relative;
    width: 520px;
    height: 680px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  @media (max-width: 560px){
    .rose-wrap{ transform: scale(0.68); }
  }
  @media (min-width: 561px) and (max-width: 860px){
    .rose-wrap{ transform: scale(0.88); }
  }

  .stem{
    position:absolute;
    bottom: 40px; left:50%;
    width:12px; height:0px;
    background: linear-gradient(180deg, var(--green), var(--green-dark));
    border-radius:6px;
    transform: translateX(-50%);
    transform-origin: bottom center;
    animation: grow-stem 1.4s ease-out forwards;
    animation-delay: .2s;
    box-shadow: 0 0 14px rgba(47,143,78,0.35);
  }
  /* stem height -> how tall the flower stands */
  @keyframes grow-stem{ to{ height: 300px; } }

  .leaf{
    position:absolute;
    bottom: 160px;
    width: 90px; height: 46px;
    background: linear-gradient(135deg, var(--green), var(--green-dark));
    border-radius: 0 100% 0 100%;
    opacity:0;
    animation: leaf-pop .8s ease-out forwards;
    box-shadow: 0 0 12px rgba(47,143,78,0.3);
  }
  .leaf.left{ left: calc(50% - 86px); transform-origin: right center; animation-delay: 1.1s; }
  .leaf.right{ left: calc(50% - 4px); transform-origin: left center; border-radius: 100% 0 100% 0; animation-delay: 1.3s; }
  @keyframes leaf-pop{
    0%{ opacity:0; transform: scale(0) rotate(0deg); }
    100%{ opacity:1; transform: scale(1) rotate(var(--leaf-rot,0deg)); }
  }
  .leaf.left{ --leaf-rot: 8deg; }
  .leaf.right{ --leaf-rot: -8deg; }

  .flower-core{
    position:absolute;
    bottom: 340px; left:50%;
    width: 4px; height: 4px;
    transform: translateX(-50%);
  }

  .petal{
    position:absolute; left:50%; top:50%;
    width: var(--w); height: var(--h);
    background: linear-gradient(160deg, var(--c1), var(--c2));
    border-radius: 4% 96% 4% 96%;
    transform-origin: 50% 100%;
    transform: translate(-50%,-100%) rotate(var(--angle)) scale(0.08);
    opacity: 0;
    box-shadow: 0 3px 14px rgba(0,0,0,0.4), inset 0 0 16px rgba(255,255,255,0.08);
    animation: bloom-petal var(--dur) cubic-bezier(.2,.8,.25,1) forwards;
    animation-delay: var(--delay);
  }
  @keyframes bloom-petal{
    0%{ opacity:0; transform: translate(-50%,-100%) rotate(var(--angle)) scale(0.05); }
    35%{ opacity:1; }
    100%{ opacity:1; transform: translate(-50%,-100%) rotate(var(--angle)) scale(1) translateY(var(--spread)); }
  }

  .glow{
    position:absolute; left:50%; bottom:260px;
    width: 460px; height:460px;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(255,45,85,0.32), transparent 70%);
    filter: blur(14px); opacity:0;
    animation: glow-in 2s ease-out forwards; animation-delay: .1s;
    pointer-events:none;
  }
  @keyframes glow-in{ to{ opacity:1; } }

  .sparkle{
    position:absolute; width:5px; height:5px;
    background:#ffdfe6; border-radius:50%; opacity:0;
    box-shadow: 0 0 10px 2px rgba(255,180,200,0.85);
    animation: sparkle-float 3s ease-in-out infinite;
  }
  @keyframes sparkle-float{
    0%{ opacity:0; transform: translateY(0); }
    20%{ opacity:1; }
    100%{ opacity:0; transform: translateY(-70px); }
  }

  .message{
    position:absolute; bottom: -80px; left:50%;
    transform: translateX(-50%);
    width: 400px; text-align:center; opacity:0;
    transition: opacity 1.4s ease, transform 1.4s ease;
  }
  .message.show{ opacity:1; transform: translateX(-50%) translateY(-14px); }
  .message p{
    font-style: italic; color: #ffd9e0; font-size: 24px; line-height:1.5;
    text-shadow: 0 0 20px rgba(255,45,85,0.5);
  }
  .message span{ display:inline-block; margin-top:8px; font-size: 24px; }

  .sound-btn{
    position:absolute; top: 18px; right: 18px;
    width: 40px; height:40px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.4); color: #fff; font-size: 18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index: 10;
  }
</style>
</head>
<body>

<div id="loading-screen" class="screen">
  <div class="card">
    <div class="bud-emoji">🌹</div>
    <!-- 🌹 EDIT HERE #1: Title on the loading card
         (คำแปล: "Love.css" เป็นชื่อเล่นๆ ของหน้านี้ ไม่แปลตรงตัวก็ได้ แต่ถ้าจะเปลี่ยนก็แก้ตรงนี้) -->
    <h1>Flowers for you</h1>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <!-- this text is driven by the "statuses" array in <script> below
         (คำแปล: "Growing digital petals ..." = "กำลังปลูกกลีบดอกดิจิทัล ..." ข้อความนี้จะถูกแทนที่โดยลิสต์ statuses ด้านล่างอัตโนมัติ ไม่ต้องแก้ตรงนี้) -->
    <div class="status-text" id="statusText">Growing digital petals ...</div>
    <!-- คำแปล: "TAP TO BLOOM" = "แตะเพื่อให้บาน" -->
    <button class="bloom-btn" id="bloomBtn" disabled>TAP TO BLOOM</button>
  </div>
</div>

<div id="garden-screen" class="screen">
  <button class="sound-btn" id="soundBtn">🔇</button>
  <div class="rose-wrap">
    <div class="glow"></div>
    <div class="stem"></div>
    <div class="leaf left"></div>
    <div class="leaf right"></div>
    <div class="flower-core" id="flowerCore"></div>
    <div class="message" id="message">
      <!-- 🌹 EDIT HERE #2: The final message shown after the flower blooms
           (คำแปล: "i coded this for you" = "ฉันเขียนโค้ดนี้ขึ้นมาเพื่อเธอ") -->
      <p>ma jup tee neung</p>
      <span>🌹</span>
    </div>
  </div>
</div>

<!-- 🌹 EDIT HERE #3 (MUSIC):
     Put your own mp3 file next to this html file (same folder) and change
     the src="" below to its filename, e.g. src="my-song.mp3". -->
<audio id="bgMusic" loop preload="auto">
  <source src="love.mp3" type="audio/mpeg">
</audio>

<script>
  // ==========================================================
  // 🌹 EDIT HERE #4: loading status messages
  // ข้อความเหล่านี้จะขึ้นสลับกันไปเรื่อยๆ ระหว่างที่แถบโหลดวิ่ง
  // คำแปลของแต่ละบรรทัด (เรียงตามลำดับด้านล่าง):
  //   'Growing digital petals ...'        = "กำลังปลูกกลีบดอกดิจิทัล ..."
  //   'Watering with a little code ...'   = "รดน้ำด้วยโค้ดนิดหน่อย ..."
  //   'Compiling affection.css ...'       = "กำลังคอมไพล์ความรัก.css ..."
  //   'Almost blooming ...'               = "ใกล้จะบานแล้ว ..."
  // จะแก้เป็นข้อความไทยตรงๆ เลยก็ได้ เช่น 'กำลังปลูกกลีบดอกดิจิทัล ...'
  // ==========================================================
  const statuses = [
    'Growing digital petals ...',
    'Watering with a little code ...',
    'Compiling affection.css ...',
    'Almost blooming ...'
  ];

  const barFill = document.getElementById('barFill');
  const statusText = document.getElementById('statusText');
  const bloomBtn = document.getElementById('bloomBtn');
  const loadingScreen = document.getElementById('loading-screen');
  const gardenScreen = document.getElementById('garden-screen');
  const flowerCore = document.getElementById('flowerCore');
  const message = document.getElementById('message');
  const bgMusic = document.getElementById('bgMusic');
  const soundBtn = document.getElementById('soundBtn');

  let progress = 0;
  let statusIndex = 0;
  const loadInterval = setInterval(() => {
    progress += Math.random() * 9 + 3;
    if (progress >= 100) {
      progress = 100;
      clearInterval(loadInterval);
      // คำแปล: "Ready to bloom 🌸" = "พร้อมที่จะบานแล้ว 🌸"
      statusText.textContent = 'Ready to bloom 🌸';
      bloomBtn.disabled = false;
      bloomBtn.classList.add('ready');
    } else {
      const newIndex = Math.min(statuses.length - 1, Math.floor(progress / 26));
      if (newIndex !== statusIndex) {
        statusIndex = newIndex;
        statusText.textContent = statuses[statusIndex];
      }
    }
    barFill.style.width = progress + '%';
  }, 220);

  // ==========================================================
  // 🌹 EDIT HERE #5: flower size & petal layers.
  // - count = petals in that ring
  // - w / h = petal width/height in px (bigger = bigger flower)
  // - c1/c2 = petal color gradient (top color / bottom color)
  // Add a 4th object here for an extra outer ring of petals.
  // ==========================================================
  const PETAL_LAYERS = [
    { count: 6, w: 62,  h: 98,  spread: -12, delayBase: 0.0, c1: '#ff5c7a', c2: '#c2123f' },
    { count: 7, w: 84,  h: 128, spread: -4,  delayBase: 0.5, c1: '#ef2f57', c2: '#9c0d33' },
    { count: 8, w: 108, h: 158, spread: 6,   delayBase: 1.0, c1: '#d81b47', c2: '#6e0420' },
  ];

  function createPetals(){
    flowerCore.innerHTML = '';
    PETAL_LAYERS.forEach((layer, li) => {
      const angleStep = 360 / layer.count;
      const layerOffset = li * 24 + (Math.random() - 0.5) * 8;

      for (let i = 0; i < layer.count; i++) {
        const petal = document.createElement('div');
        petal.className = 'petal';

        const angle = layerOffset + i * angleStep + (Math.random() - 0.5) * 5;
        const delay = layer.delayBase + i * 0.05 + Math.random() * 0.15;
        const jitterW = layer.w + (Math.random() - 0.5) * 8;
        const jitterH = layer.h + (Math.random() - 0.5) * 10;
        const dur = 1.6 + Math.random() * 0.4;

        petal.style.setProperty('--w', jitterW + 'px');
        petal.style.setProperty('--h', jitterH + 'px');
        petal.style.setProperty('--angle', angle + 'deg');
        petal.style.setProperty('--delay', delay + 's');
        petal.style.setProperty('--dur', dur + 's');
        petal.style.setProperty('--spread', layer.spread + 'px');
        petal.style.setProperty('--c1', layer.c1);
        petal.style.setProperty('--c2', layer.c2);

        flowerCore.appendChild(petal);
      }
    });

    // sparkles floating around the flower
    for (let s = 0; s < 12; s++) {
      const sp = document.createElement('div');
      sp.className = 'sparkle';
      sp.style.left = (30 + Math.random() * 460) + 'px';
      sp.style.bottom = (300 + Math.random() * 220) + 'px';
      sp.style.animationDelay = (2 + Math.random() * 2) + 's';
      document.querySelector('.rose-wrap').appendChild(sp);
    }
  }

  bloomBtn.addEventListener('click', () => {
    if (bloomBtn.disabled) return;
    loadingScreen.style.opacity = '0';
    setTimeout(() => { loadingScreen.style.display = 'none'; }, 600);

    createPetals();
    gardenScreen.classList.add('show');

    bgMusic.volume = 0.6;
    bgMusic.play().then(() => {
      soundBtn.textContent = '🔊';
    }).catch(() => {
      soundBtn.textContent = '🔇';
    });

    // 🌹 EDIT HERE #6: delay (ms) before the final message fades in
    setTimeout(() => {
      message.classList.add('show');
    }, 3400);
  });

  soundBtn.addEventListener('click', () => {
    if (bgMusic.paused) {
      bgMusic.play();
      soundBtn.textContent = '🔊';
    } else {
      bgMusic.pause();
      soundBtn.textContent = '🔇';
    }
  });
</script>

</body>
</html>
